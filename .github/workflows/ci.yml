name: CI
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "shaders/**"
      - "tests/**"
      - "probe/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - "mise.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "shaders/**"
      - "tests/**"
      - "probe/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - "mise.toml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      - name: Install MinGW + Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-i686 g++-mingw-w64-i686 wine wine32
      - name: Init Wine prefix
        run: WINEDEBUG=-all wineboot --init
        env:
          DISPLAY: ""
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/CPM
          key: cpm-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
          restore-keys: cpm-
      - run: mise run build:release
      - run: mise run build
      - run: mise run test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: PaniniWoW-${{ github.sha }}
          path: build/cross-mingw32/bin/PaniniWoW.dll
